<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="GeoPDF Web Viewer – offline-capable field map viewer with GPS, waypoints, and track recording" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>GeoPDF Web Viewer</title>
    <style>
      /* Prevent flash of unstyled content */
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0f172a; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback shown if React fails to mount -->
      <div id="js-fallback" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#94a3b8;font-family:sans-serif;font-size:14px;flex-direction:column;gap:12px;">
        <div style="font-size:24px;">⚙</div>
        <div>Loading GeoPDF Viewer…</div>
        <div id="js-error" style="color:#f87171;font-size:12px;max-width:400px;text-align:center;display:none;"></div>
      </div>
    </div>
    <script>
      // Catch any top-level JS errors and display them
      window.addEventListener('error', function(e) {
        var el = document.getElementById('js-error');
        if (el) { el.style.display = 'block'; el.textContent = 'Error: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')'; }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('js-error');
        if (el) { el.style.display = 'block'; el.textContent = 'Promise error: ' + (e.reason?.message || e.reason); }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
